services:
  inspector:
    image: node:22-alpine
    command: npx --yes @modelcontextprotocol/inspector
    ports:
      - "${INSPECTOR_UI_PORT:-6274}:6274"
      - "${INSPECTOR_PROXY_PORT:-6277}:6277"
    environment:
      HOST: "0.0.0.0"
      MCP_PROXY_AUTH_TOKEN: ${INSPECTOR_AUTH_TOKEN:-changeme}
      ALLOWED_ORIGINS: "http://localhost:${INSPECTOR_UI_PORT:-6274}"
    restart: unless-stopped

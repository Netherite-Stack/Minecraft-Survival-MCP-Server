name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      packages: write

    steps:
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capture previous tag
        id: previous_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: npx semantic-release

      - name: Capture released version
        id: release_version
        run: |
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "${{ steps.previous_tag.outputs.tag }}" ]; then
            echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.release_version.outputs.version != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release_version.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.release_version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.generate_token.outputs.token }}

      - name: Build and push
        if: steps.release_version.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/netherite-stack/minecraft-survival-mcp-server:latest
            ghcr.io/netherite-stack/minecraft-survival-mcp-server:${{ steps.release_version.outputs.version }}
